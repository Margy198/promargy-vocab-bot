name: Send practice reminders

# Раз в час дёргает функцию бота с секретом ?remind=..., чтобы она
# разослала напоминания тем, кому в этот час пора (см. sendReminders() и
# dueReminderHour() в telegram-webhook.js). Частоту (раз в N дней) и часы
# (по Москве, до 3 в день) каждый ученик выбирает сам в /reminders.

on:
  schedule:
    # Раз в час (на 7-й минуте — на ровный час GitHub запускает хуже всего,
    # с задержками). Ученики сами выбирают часы напоминаний по Москве, функция
    # сама решает, кому в этот час пора; если прогон опоздал или пропал,
    # следующий «догонит» пропущенный час (см. REMINDER_CATCHUP_HOURS).
    - cron: "7 * * * *"
  workflow_dispatch: {}

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger reminder run
        run: |
          curl -s -w "\nstatus: %{http_code}\n" "https://magical-nougat-d42dea.netlify.app/telegram-webhook?remind=sdkffkfk"
