name: Send practice reminders

# Три раза в день дёргает функцию бота с секретом ?remind=..., чтобы она
# разослала напоминания тем, кто давно не появлялся (см. sendReminders()
# в telegram-webhook.js). Времена — 8:00, 13:00 и 20:00 по Москве
# (MSK = UTC+3, круглый год без перевода часов), переведены в UTC ниже.
# Сама логика "не чаще раза в 3 дня одному и тому же" не меняется —
# несколько прогонов в день просто чаще ПРОВЕРЯЮТ, а не чаще шлют.

on:
  schedule:
    - cron: "0 5 * * *" # 8:00 MSK
    - cron: "0 10 * * *" # 13:00 MSK
    - cron: "0 17 * * *" # 20:00 MSK
  workflow_dispatch: {}

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger reminder run
        run: |
          curl -s -w "\nstatus: %{http_code}\n" "https://magical-nougat-d42dea.netlify.app/telegram-webhook?remind=sdkffkfk"
