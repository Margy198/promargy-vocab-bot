<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Добавить слова — Promargy Vocab Bot</title>
<style>
  :root {
    --bg: #f4f7f2;
    --card: #ffffff;
    --ink: #1e2b23;
    --muted: #5f7268;
    --line: #d9e3dc;
    --green: #3f8a5c;
    --green-dark: #2e6b46;
    --green-pale: #e8f3ec;
    --error: #b3402f;
    --error-pale: #fbeae7;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 2.5rem 1.25rem;
  }
  main { width: 100%; max-width: 34rem; }
  h1 {
    font-size: 1.5rem;
    margin: 0 0 0.35rem;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }
  .sub {
    color: var(--muted);
    font-size: 0.92rem;
    margin: 0 0 1.75rem;
    line-height: 1.5;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 1.5rem;
    box-shadow: 0 1px 2px rgba(30, 43, 35, 0.04);
  }
  label {
    display: block;
    font-size: 0.85rem;
    font-weight: 600;
    margin: 0 0 0.4rem;
    color: var(--green-dark);
  }
  .field { margin-bottom: 1.15rem; }
  input[type="text"],
  input[type="password"],
  textarea {
    width: 100%;
    font-family: inherit;
    font-size: 0.95rem;
    padding: 0.6rem 0.75rem;
    border: 1.5px solid var(--line);
    border-radius: 8px;
    background: #fbfdfb;
    color: var(--ink);
    transition: border-color 0.15s;
  }
  input:focus, textarea:focus {
    outline: none;
    border-color: var(--green);
  }
  textarea {
    resize: vertical;
    min-height: 11rem;
    line-height: 1.5;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 0.87rem;
  }
  .hint { font-size: 0.78rem; color: var(--muted); margin-top: 0.3rem; }
  button {
    width: 100%;
    background: var(--green);
    color: #fff;
    border: none;
    border-radius: 9px;
    padding: 0.75rem 1rem;
    font-size: 0.98rem;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s, transform 0.08s;
  }
  button:hover { background: var(--green-dark); }
  button:active { transform: scale(0.99); }
  button:disabled { opacity: 0.55; cursor: default; }
  .result {
    margin-top: 1.1rem;
    padding: 0.85rem 1rem;
    border-radius: 9px;
    font-size: 0.9rem;
    line-height: 1.5;
    display: none;
  }
  .result.show { display: block; }
  .result.ok { background: var(--green-pale); color: var(--green-dark); border: 1px solid #bfe0cc; }
  .result.err { background: var(--error-pale); color: var(--error); border: 1px solid #f0c6bd; }
  .secret-row { display: flex; gap: 0.5rem; align-items: center; }
  .secret-row input { flex: 1; }
  .remember { font-size: 0.78rem; color: var(--muted); margin-top: 0.35rem; display: flex; gap: 0.4rem; align-items: center; }
  footer { text-align: center; margin-top: 1.5rem; font-size: 0.78rem; color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>🎓 Добавить слова</h1>
  <p class="sub">Вставь слова в словарь любого ученика напрямую, без переписки в Telegram.</p>

  <div class="card">
    <form id="form">
      <div class="field">
        <label for="secret">Секрет администратора</label>
        <div class="secret-row">
          <input type="password" id="secret" autocomplete="off" placeholder="секрет" />
        </div>
        <div class="remember">
          <input type="checkbox" id="rememberSecret" />
          <label for="rememberSecret" style="font-weight:400;color:inherit;margin:0;">запомнить в этом браузере</label>
        </div>
      </div>

      <div class="field">
        <label for="target">Кому (@username или chat_id)</label>
        <input type="text" id="target" placeholder="@no4proidet" autocomplete="off" />
        <div class="hint">Посмотреть — команда /students боту в Telegram.</div>
      </div>

      <div class="field">
        <label for="words">Слова</label>
        <textarea id="words" placeholder="English . перевод&#10;Another word . другой перевод"></textarea>
        <div class="hint">По одной строке, формат «English . перевод» — как обычно для бота.</div>
      </div>

      <button type="submit" id="submitBtn">Добавить</button>
    </form>
    <div class="result" id="result"></div>
  </div>

  <footer>Promargy Vocab Bot · служебная страница</footer>
</main>

<script>
  const ENDPOINT = "/telegram-webhook";
  const secretInput = document.getElementById("secret");
  const rememberBox = document.getElementById("rememberSecret");
  const form = document.getElementById("form");
  const resultBox = document.getElementById("result");
  const submitBtn = document.getElementById("submitBtn");

  const savedSecret = localStorage.getItem("promargy_admin_secret");
  if (savedSecret) {
    secretInput.value = savedSecret;
    rememberBox.checked = true;
  }

  function showResult(kind, text) {
    resultBox.className = "result show " + kind;
    resultBox.textContent = text;
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const adminSecret = secretInput.value.trim();
    const target = document.getElementById("target").value.trim();
    const words = document.getElementById("words").value;

    if (!adminSecret || !target || !words.trim()) {
      showResult("err", "Заполни секрет, получателя и хотя бы одно слово.");
      return;
    }

    if (rememberBox.checked) {
      localStorage.setItem("promargy_admin_secret", adminSecret);
    } else {
      localStorage.removeItem("promargy_admin_secret");
    }

    submitBtn.disabled = true;
    submitBtn.textContent = "Добавляю…";
    resultBox.className = "result";

    try {
      const res = await fetch(ENDPOINT, {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ adminSecret, target, words }),
      });
      const data = await res.json();
      if (data.ok) {
        let msg = `Добавлено: ${data.added}. Всего у него в словаре: ${data.total}.`;
        if (data.skippedDupes) msg += ` Пропущено как дубли: ${data.skippedDupes}.`;
        showResult("ok", msg);
        document.getElementById("words").value = "";
      } else {
        showResult("err", data.error || "Что-то пошло не так.");
      }
    } catch (err) {
      showResult("err", "Не получилось связаться с ботом. Проверь соединение и попробуй ещё раз.");
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = "Добавить";
    }
  });
</script>
</body>
</html>
