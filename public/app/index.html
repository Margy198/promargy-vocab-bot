<script>
// Параметры запуска Telegram приходят в адресе (#tgWebAppData=…), но официальный скрипт
// стирает их сразу после чтения. Поэтому забираем их ДО его загрузки.
(function () {
  var p = {};
  try {
    (location.hash || "").replace(/^#/, "").split("&").forEach(function (kv) { var i = kv.indexOf("="); if (i > 0) { try { p[decodeURIComponent(kv.slice(0, i))] = decodeURIComponent(kv.slice(i + 1)); } catch (e) {} } });

    var t = new URLSearchParams(location.search).get("t") || p.tgWebAppStartParam || "";
    if (t) localStorage.setItem("__appToken", t);
    window.__appToken = t || localStorage.getItem("__appToken") || "";

})();
</script>

<style>
  /* Дизайн-система из макетов Маргариты (Sketch «Приложение 1»):
     фон #fbfbfb, текст #2e2e2e / #3d3542, акцент #1dfff8→#11c8c4,
     мягкий акцент #91fcf9 (40%), пастельные градиенты карточек,
     скругления 16 / 10 / 30, шрифт Avenir Next → Manrope. */
  :root {
    --bg: #fbfbfb; --card: #ffffff; --text: #2e2e2e; --text-2: #3d3542; --muted: #8a8a92; --line: #ececf0;
    --accent: #17afa8; --accent-strong: #11c8c4; --accent-light: #1dfff8; --accent-soft: rgba(145, 252, 249, 0.4); --glow: rgba(55, 241, 236, 0.45);
    --g-aqua: linear-gradient(120deg, #b8fffd 0%, #dae1f7 100%);
    --g-lavender: linear-gradient(120deg, #dae1f7 0%, #ffb9dd 100%);
    --g-pink: linear-gradient(120deg, #ffb9dd 0%, #f7eeda 100%);
    --g-cream: linear-gradient(120deg, #f7eeda 0%, #e6ffff 100%);
    --g-accent: linear-gradient(135deg, #1dfff8 0%, #11c8c4 100%);
    --g-splash: linear-gradient(160deg, #ffffff 0%, #c8fffd 55%, #37f1ec 100%);
    --radius: 16px; --radius-s: 10px; --shadow: 0 10px 30px rgba(61, 53, 66, 0.08); --tabbar-h: 72px;
    --on-pastel: #2e2e2e; --chip-bg: rgba(255, 255, 255, 0.75); --soft: #eef9f8; --soft-fg: #0f8f8a; --callout: #f3f3f6; --ok-bg: #e9f6e5; --ok-fg: #2f6b22; --ok-line: #8fcf7f; --bad-bg: #ffe1ec; --bad-fg: #8f3d64; --bad-line: #ff9ec4;
    --tag-started-bg: #e3fbfa; --tag-started-fg: #0f8f8a; --tag-done-bg: #e9f6e5; --tag-done-fg: #4e8a3f; --tag-locked-bg: #f0edf2; --tag-locked-fg: #8a8a92; --switch-off: rgba(61,53,66,.15); --tabbar-bg: rgba(255, 255, 255, 0.92); --sheet-dim: rgba(61,53,66,.25); --toast-bg: #3d3542; --toast-fg: #fff;
  }
  /* Тёмная тема — включается по настройке Telegram (colorScheme) */
  :root[data-theme="dark"] {
    --bg: #141318; --card: #1f1d25; --text: #ececf0; --text-2: #e9e5ee; --muted: #9a97a3; --line: #2d2b35;
    --accent: #2fd8d0; --accent-soft: rgba(47, 216, 208, 0.18); --glow: rgba(47, 216, 208, 0.35); --shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    --g-aqua: linear-gradient(120deg, #1d4f4e 0%, #2a2d4f 100%);
    --g-lavender: linear-gradient(120deg, #2a2d4f 0%, #4a2a40 100%);
    --g-pink: linear-gradient(120deg, #4a2a40 0%, #3f3a2d 100%);
    --g-cream: linear-gradient(120deg, #3f3a2d 0%, #1d4f4e 100%);
    --g-splash: linear-gradient(160deg, #141318 0%, #1d4f4e 55%, #11c8c4 100%);
    --on-pastel: #ececf0; --chip-bg: rgba(255, 255, 255, 0.12); --soft: #163534; --soft-fg: #6fe3dc; --callout: #26242e; --ok-bg: #1f3a1a; --ok-fg: #a6e39a; --ok-line: #3e7a33; --bad-bg: #3f1f2c; --bad-fg: #ffb3cf; --bad-line: #8f3d64;
    --tag-started-bg: #163534; --tag-started-fg: #6fe3dc; --tag-done-bg: #1f3a1a; --tag-done-fg: #a6e39a; --tag-locked-bg: #26242e; --tag-locked-fg: #8a8a92; --switch-off: rgba(255,255,255,.18); --tabbar-bg: rgba(31, 29, 37, 0.94); --sheet-dim: rgba(0,0,0,.55); --toast-bg: #ececf0; --toast-fg: #141318;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font-family: "Avenir Next", "Nunito Sans", system-ui, -apple-system, sans-serif; font-weight: 400; -webkit-font-smoothing: antialiased; }
  body { min-height: 100vh; padding-bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom)); }
  .page { max-width: 560px; margin: 0 auto; padding: 16px 16px 24px; display: none; }
  .page.active { display: block; }
  h1, h2, h3 { font-family: "Manrope", "Avenir Next", "Nunito Sans", system-ui, sans-serif; font-weight: 600; margin: 0; color: var(--text-2); }
  h1 { font-size: 26px; letter-spacing: -0.01em; }
  h2 { font-size: 18px; margin: 22px 0 12px; }
  .muted { color: var(--muted); font-size: 13px; }
  .row { display: flex; align-items: center; gap: 10px; }
  .between { justify-content: space-between; }
  .card { background: var(--card); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); }
  .card + .card { margin-top: 12px; }
  .card.aqua { background: var(--g-aqua); } .card.lavender { background: var(--g-lavender); } .card.pink { background: var(--g-pink); } .card.cream { background: var(--g-cream); }
  .pill { display: inline-block; padding: 5px 10px; border-radius: 8px; background: var(--chip-bg); font-size: 13px; color: var(--text-2); }
  .pill.ok { background: var(--ok-fg); color: var(--ok-bg); } .pill.accent { background: var(--accent-soft); }
  .big { font-size: 40px; font-weight: 500; line-height: 1; color: var(--text-2); }
  .fab { width: 46px; height: 46px; border-radius: 50%; background: var(--g-accent); display: grid; place-items: center; box-shadow: 0 8px 22px var(--glow); border: none; color: #2e2e2e; flex: none; cursor: pointer; }
  .fab svg { width: 20px; height: 20px; }
  .fab.ghost { background: var(--chip-bg); box-shadow: 0 6px 16px rgba(61,53,66,.08); }
  .bar { height: 8px; border-radius: 8px; background: rgba(61, 53, 66, 0.08); overflow: hidden; }
  .bar > i { display: block; height: 100%; border-radius: 8px; background: var(--g-accent); box-shadow: 0 0 12px var(--glow); transition: width .6s ease; }
  .quest { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .quest:last-child { border-bottom: none; }
  .check { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--accent-light); display: grid; place-items: center; flex: none; color: #fff; font-size: 14px; }
  .check.done { background: var(--g-accent); border-color: transparent; box-shadow: 0 0 10px var(--glow); color: #2e2e2e; }
  .fab, .cb.on, .chip.on, .seg button.on, .lvl .ring .pct, .btn.primary { color: #2e2e2e; }
  .quest .t { flex: 1; font-size: 14px; } .quest .p { font-size: 13px; color: var(--muted); }
  .chart { display: flex; align-items: flex-end; gap: 6px; height: 92px; padding-top: 8px; }
  .chart .col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .chart .b { width: 100%; max-width: 22px; border-radius: 6px 6px 3px 3px; background: var(--g-accent); min-height: 3px; opacity: .9; }
  .chart .b.empty { background: rgba(61, 53, 66, 0.08); } .chart .d { font-size: 10px; color: var(--muted); }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .ach { background: var(--card); border-radius: var(--radius-s); padding: 10px 6px; text-align: center; box-shadow: var(--shadow); }
  .ach .e { font-size: 26px; } .ach .n { font-size: 11px; color: var(--text-2); margin-top: 4px; line-height: 1.2; }
  .ach.locked { opacity: .38; filter: grayscale(1); }
  .word { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  .word:last-child { border-bottom: none; }
  .word .en { flex: 1; } .word .ru { color: var(--muted); text-align: right; max-width: 48%; } .word .n { color: var(--bad-fg); font-size: 12px; margin-left: 8px; } .word .due { color: var(--accent); font-size: 11px; margin-left: 8px; }
  .cb { width: 22px; height: 22px; border-radius: 7px; border: 2px solid var(--accent-light); flex: none; display: grid; place-items: center; font-size: 13px; color: #2e2e2e; }
  .cb.on { background: var(--g-accent); border-color: transparent; }
  .tabbar { position: fixed; left: 0; right: 0; bottom: 0; height: calc(var(--tabbar-h) + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom); background: var(--tabbar-bg); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-radius: 20px 20px 0 0; box-shadow: 0 -8px 30px rgba(61, 53, 66, 0.08); display: flex; justify-content: space-around; align-items: center; z-index: 5; }
  .tab { background: none; border: none; display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--text-2); font: inherit; font-size: 11px; padding: 6px 8px; cursor: pointer; }
  .tab svg { width: 24px; height: 24px; stroke: var(--accent-light); fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; filter: drop-shadow(0 0 6px var(--glow)); }
  .tab.active svg { stroke: var(--accent); } .tab.active { color: var(--accent); }
  .splash { position: fixed; inset: 0; background: var(--g-splash); display: grid; place-items: center; z-index: 10; transition: opacity .4s ease; }
  .splash .logo { font-size: 44px; font-weight: 400; color: var(--text-2); letter-spacing: 0.01em; }
  .splash .dot { position: absolute; top: 36px; left: 28px; width: 20px; height: 20px; border-radius: 50%; background: var(--g-accent); box-shadow: 0 6px 16px var(--glow); }
  .splash.hide { opacity: 0; pointer-events: none; }
  .notice { background: var(--card); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow); font-size: 14px; line-height: 1.5; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 14px; border-radius: var(--radius); border: none; font: inherit; font-size: 15px; color: var(--text-2); background: var(--accent-soft); cursor: pointer; }
  .btn.primary { background: var(--g-accent); box-shadow: 0 10px 24px var(--glow); }
  .btn.danger { background: var(--bad-bg); color: var(--bad-fg); } .btn.small { width: auto; padding: 10px 14px; font-size: 14px; border-radius: 12px; }
  .search { display: flex; align-items: center; gap: 10px; background: var(--card); border-radius: 30px; padding: 10px 14px; box-shadow: var(--shadow); }
  .search input { border: none; outline: none; font: inherit; font-size: 15px; flex: 1; background: transparent; color: var(--text); }
  .search svg { width: 20px; height: 20px; stroke: var(--accent); fill: none; stroke-width: 2; stroke-linecap: round; }
  .folder { display: flex; align-items: center; justify-content: space-between; padding: 18px 16px; border-radius: var(--radius); box-shadow: var(--shadow); margin-top: 12px; cursor: pointer; }
  .folder .t { font-size: 18px; color: var(--text-2); } .folder .pills { margin-top: 8px; display: flex; gap: 6px; flex-wrap: wrap; }

  .plan-row { margin-top: 10px; padding: 14px 14px; } .plan-row.done { opacity: .7; }
  .pn { flex: none; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; background: var(--accent-soft); color: var(--text-2); }
  .plink { display: block; width: 100%; text-align: left; margin-top: 8px; padding: 8px 10px; border-radius: 10px; border: none; background: var(--soft); color: var(--text); font: inherit; font-size: 14px; cursor: pointer; }
  .pchip { font: inherit; font-size: 13px; padding: 7px 12px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--card); color: var(--text-2); cursor: pointer; }
  .pchip.on { background: var(--ok-bg); border-color: var(--ok-line); color: var(--ok-fg); }
  .seg button { font: inherit; font-size: 13px; padding: 8px 12px; border-radius: 10px; border: 1.5px solid var(--accent-soft); background: var(--card); color: var(--text-2); cursor: pointer; }
  .seg button.on { background: var(--g-accent); border-color: transparent; box-shadow: 0 4px 14px var(--glow); }
  .avatars { display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px; }
  .avatars button { font-size: 22px; padding: 6px 0; border-radius: 10px; border: 1.5px solid transparent; background: var(--card); cursor: pointer; box-shadow: var(--shadow); }
  .avatars button.on { border-color: var(--accent-light); box-shadow: 0 0 12px var(--glow); }

  .lrow.me { background: var(--g-aqua); } .lrow .pl { width: 30px; text-align: center; font-size: 16px; } .lrow .nm { flex: 1; } .lrow .xp { color: var(--text-2); }

<script>
(function () {
  const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
  const initData = tg && tg.initData ? tg.initData : "";
  const API = "/telegram-webhook";
  // Подписанная ботом ссылка — запасной вход, когда Telegram не передал данные пользователя
  let appToken = ""; try { appToken = window.__appToken || ""; } catch (e) {}
  const DEMO = !initData && !appToken; // вне Telegram — демо-данные, чтобы смотреть дизайн в браузере
  // Короткая строка-диагностика: по ней видно, почему приложение решило, что оно вне Telegram
  function tgDiag() {
    const b = window.__tgBridge || {};
    return `sdk:${b.sdk ? (b.sdkInit ? "с данными" : "пустой") : "нет"} источник:${b.source || "?"} параметры:${b.keys || "?"} мост:${b.used ? "да" : b.patched ? "починил" : "нет"} ссылка:${(window.__appToken ? "есть" : "нет")} ${b.platform || "?"}`;
  }
  function applyTheme() {
    let scheme = tg && tg.colorScheme ? tg.colorScheme : (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    try { const q = new URLSearchParams(location.search).get("theme"); if (q === "dark" || q === "light") scheme = q; } catch (e) {}
    document.documentElement.dataset.theme = scheme;
    const bg = scheme === "dark" ? "#141318" : "#fbfbfb";
    if (tg) { try { tg.setHeaderColor(bg); tg.setBackgroundColor(bg); if (tg.setBottomBarColor) tg.setBottomBarColor(scheme === "dark" ? "#1f1d25" : "#ffffff"); } catch (e) {} }
  }
  if (tg) { try { tg.ready(); tg.expand(); } catch (e) {} try { tg.onEvent("themeChanged", applyTheme); } catch (e) {} }
  applyTheme();

  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const plural = (n, f) => { const a = Math.abs(n) % 100, b = a % 10; if (a > 10 && a < 20) return f[2]; if (b > 1 && b < 5) return f[1]; if (b === 1) return f[0]; return f[2]; };
  const iconArrow = () => '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
  const iconPlus = () => '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>';
  const GRADS = ["aqua", "lavender", "pink", "cream"];
  const state = { me: null, vocab: null, league: null, options: null, folder: null, selected: new Set(), query: "", gender: null, course: null, slang: null, notes: null, study: { view: "home" }, topic: null, topicProgress: null, topicNotes: [] };
  const gend = (m, f) => state.gender === "f" ? f : state.gender === "m" ? m : m + "(" + f.slice(m.length) + ")";

  function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 1800); }
  function haptic(kind) { try { tg && tg.HapticFeedback && tg.HapticFeedback.impactOccurred(kind || "light"); } catch (e) {} }
  function openSheet(html) { $("#sheet").innerHTML = html; $("#sheet-bg").classList.add("open"); }
  function closeSheet() { $("#sheet-bg").classList.remove("open"); }
  $("#sheet-bg").addEventListener("click", (e) => { if (e.target.id === "sheet-bg") closeSheet(); });
  function closeApp(hint) { if (tg) { try { tg.close(); } catch (e) {} } else toast(hint || "В Telegram это закроет приложение и вернёт в чат"); }

  // ---------- API ----------
  // Любая ошибка сети/сервера превращается в {ok:false, error, detail}, чтобы экран показал причину, а не висел
  async function api(action, extra) {
    if (DEMO) { try { return await demo(action, extra || {}); } catch (e) { return { ok: false, error: "demo", detail: String(e && e.message || e) }; } }
    let r;
    try { r = await fetch(API, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(Object.assign({ initData, appToken, action }, extra || {})) }); }
    catch (e) { return { ok: false, error: "network", detail: String(e && e.message || e) }; }
    const text = await r.text();
    try { return JSON.parse(text); } catch (e) { return { ok: false, error: "http_" + r.status, detail: text.slice(0, 200) }; }
  }

  // ---------- Демо-данные (только вне Telegram) ----------
  const demoState = {
    words: [["reliable", "надёжный", "школа"], ["consistent", "последовательный", "школа"], ["reluctant", "неохотный", null], ["stave off", "предотвращать", null], ["endure", "терпеть; выдерживать", null], ["keep up", "не отставать", "работа"], ["take over", "захватывать", "работа"], ["vanish", "исчезать", null], ["precaution", "мера предосторожности", "школа"], ["threaten", "угрожать", null], ["ciao", "привет", "итальянский"], ["grazie", "спасибо", "итальянский"]].map(([en, ru, topic]) => ({ en, ru, topic, errors: en === "reluctant" ? 4 : en === "stave off" ? 3 : 0, due: ["reliable", "endure", "ciao"].includes(en) })),
    identity: { leagueOptIn: true, leagueAnon: false, remindersEnabled: true, everyDays: 1, hours: [10, 20], goal: 20, gender: "f", avatar: "🦄" },
  };
  function demoVocab() {
    const counts = {}; for (const w of demoState.words) { const k = w.topic || "__general__"; counts[k] = (counts[k] || 0) + 1; }
    const folders = Object.keys(counts).sort((a, b) => (a === "__general__" ? -1 : b === "__general__" ? 1 : a.localeCompare(b, "ru"))).map((k) => ({ key: k, label: k === "__general__" ? "Общие слова" : k, count: counts[k], isGeneral: k === "__general__" }));
    return { ok: true, folders, words: demoState.words, total: demoState.words.length };

  // ---------- Словарь ----------
  async function loadVocab() { const v = await api("vocab"); if (v && v.ok) { state.vocab = v; state.vocabError = null; cacheSet("vocab", v); } else if (!state.vocab && cached("vocab")) { state.vocab = cached("vocab"); state.offline = true; } else if (!state.vocab) state.vocabError = true; return state.vocab; }
  function renderVocab() {
    const v = state.vocab; const root = $("#page-vocab");
    if (!v) { root.innerHTML = state.vocabError ? `<div class="notice">Не удалось загрузить словарь — проверь интернет.<br><button class="btn" id="vocab-retry" style="margin-top:10px">Попробовать ещё раз</button></div>` : `<div class="notice">Загружаю словарь…</div>`; const b = $("#vocab-retry"); if (b) b.addEventListener("click", async () => { state.vocabError = null; renderVocab(); await loadVocab(); renderVocab(); }); return; }
    if (state.folder !== null) return renderWordList();
    const folders = v.folders.map((f, i) => {
      const due = v.words.filter((w) => (w.topic || "__general__") === f.key && w.due).length;
      return `<div class="folder card ${GRADS[i % GRADS.length]}" data-folder="${esc(f.key)}">
        <div><div class="t">${esc(f.label)}</div><div class="pills"><span class="pill">${f.count} ${plural(f.count, ["слово", "слова", "слов"])}</span>${due ? `<span class="pill accent">${due} повторить</span>` : ""}</div></div>
        <button class="fab">${iconArrow()}</button></div>`;
    }).join("");
    root.innerHTML = `
      <div class="row between" style="margin-bottom:14px"><div><h1>Словарь</h1><div class="muted">${v.total} ${plural(v.total, ["слово", "слова", "слов"])} · ${v.folders.length} ${plural(v.folders.length, ["папка", "папки", "папок"])}</div></div><button class="fab" id="add-words">${iconPlus()}</button></div>
      <div class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" placeholder="Поиск по всем словам" value="${esc(state.query)}" /></div>
      ${v.total ? "" : `<div class="notice" style="margin-top:14px">Словарь пустой. Нажми + и вставь слова в формате «слово . перевод».</div>`}
      <div class="folder card aqua" data-folder="*"><div><div class="t">Все слова</div><div class="pills"><span class="pill">${v.total}</span></div></div><button class="fab">${iconArrow()}</button></div>
      ${folders}
      <div class="muted" style="margin-top:16px;line-height:1.5">Папка появляется сама, когда ты добавляешь слова со строкой #название. Слово, которое уже есть, переезжает в эту папку.</div>`;
    root.querySelectorAll("[data-folder]").forEach((el) => el.addEventListener("click", () => { state.folder = el.dataset.folder; state.selected.clear(); renderWordList(); }));
    $("#q").addEventListener("input", (e) => { state.query = e.target.value; if (state.query.trim()) { state.folder = "*"; renderWordList(); } });
    $("#add-words").addEventListener("click", () => openAddSheet(null));
  }
  function renderWordList() {
    const v = state.vocab; const root = $("#page-vocab");
    const key = state.folder; const q = state.query.trim().toLowerCase();
    const folder = v.folders.find((f) => f.key === key);
    const title = key === "*" ? "Все слова" : folder ? folder.label : "Папка";
    let words = key === "*" ? v.words : v.words.filter((w) => (w.topic || "__general__") === key);
    if (q) words = words.filter((w) => w.en.toLowerCase().includes(q) || (w.ru || "").toLowerCase().includes(q));
    const rows = words.map((w) => `<div class="word" data-en="${esc(w.en)}"><div class="cb ${state.selected.has(w.en) ? "on" : ""}">${state.selected.has(w.en) ? "✓" : ""}</div><span class="en">${esc(w.en)}${w.errors ? `<span class="n">×${w.errors}</span>` : ""}${w.due ? `<span class="due">повторить</span>` : ""}</span><span class="ru">${esc(w.ru || "")}</span></div>`).join("");
    const canRename = folder && !folder.isGeneral;
    root.innerHTML = `
      <div class="row between" style="margin-bottom:12px"><div><button class="back" id="back">← Папки</button><h1 style="margin-top:4px">${esc(title)}</h1><div class="muted">${words.length} ${plural(words.length, ["слово", "слова", "слов"])}${q ? ` по запросу «${esc(state.query)}»` : ""}</div></div>
        <div class="row">${canRename ? `<button class="fab ghost" id="rename" title="Переименовать">✏️</button>` : ""}<button class="fab" id="add-words">${iconPlus()}</button></div></div>
      <div class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" placeholder="Поиск" value="${esc(state.query)}" /></div>
      <div class="card" style="margin-top:12px;padding:4px 16px">${rows || `<div class="muted" style="padding:12px 0">Ничего не найдено.</div>`}</div>
      <div class="muted" style="margin-top:10px">Нажми на слово, чтобы выбрать: выбранные можно удалить или перенести в папку.</div>
      <div style="height:70px"></div>`;
    $("#back").addEventListener("click", () => { state.folder = null; state.query = ""; state.selected.clear(); removeActions(); renderVocab(); });
    $("#q").addEventListener("input", (e) => { state.query = e.target.value; renderWordList(); setTimeout(() => { const i = $("#q"); i.focus(); i.setSelectionRange(i.value.length, i.value.length); }, 0); });
    $("#add-words").addEventListener("click", () => openAddSheet(folder && !folder.isGeneral ? folder.label : null));
    if (canRename) $("#rename").addEventListener("click", () => openRenameSheet(folder.label));
    root.querySelectorAll(".word").forEach((el) => el.addEventListener("click", () => { const en = el.dataset.en; if (state.selected.has(en)) state.selected.delete(en); else state.selected.add(en); haptic(); renderWordList(); }));
    renderActions();
  }
  function removeActions() { const a = $("#actions"); if (a) a.remove(); }
  function renderActions() {
    removeActions();
    if (!state.selected.size) return;
    const n = state.selected.size;
    const bar = document.createElement("div"); bar.className = "actions"; bar.id = "actions";
    bar.innerHTML = `<button class="btn danger" id="act-del">Удалить (${n})</button><button class="btn primary" id="act-move">В папку…</button>`;
    document.body.appendChild(bar);
    $("#act-del").addEventListener("click", async () => {
      const ens = [...state.selected];
      const ok = await confirmSheet(`Удалить ${n} ${plural(n, ["слово", "слова", "слов"])}?`, "Удалить");
      if (!ok) return;
      const r = await api("deleteWords", { ens }); if (r && r.ok) { state.vocab = r; state.selected.clear(); toast(`Удалено: ${r.removedCount}`); renderWordList(); } else toast("Не получилось удалить");
    });
    $("#act-move").addEventListener("click", () => openMoveSheet([...state.selected]));
  }
  function confirmSheet(text, okLabel) {
    return new Promise((resolve) => {
      openSheet(`<h3>${esc(text)}</h3><div class="row"><button class="btn" id="c-no">Отмена</button><button class="btn danger" id="c-yes">${esc(okLabel)}</button></div>`);
      $("#c-no").addEventListener("click", () => { closeSheet(); resolve(false); });
      $("#c-yes").addEventListener("click", () => { closeSheet(); resolve(true); });
    });
  }
  function openMoveSheet(ens) {
    const folders = state.vocab.folders.filter((f) => !f.isGeneral);
    openSheet(`<h3>Перенести ${ens.length} ${plural(ens.length, ["слово", "слова", "слов"])} в папку</h3>
      <div class="seg" id="mv-folders">${folders.map((f) => `<button data-t="${esc(f.label)}">${esc(f.label)}</button>`).join("")}<button data-t="">Общие слова</button></div>
      <div style="margin-top:12px"><input class="txt" id="mv-new" placeholder="или новая папка, например школа" /></div>
      <div style="margin-top:12px"><button class="btn primary" id="mv-go">Перенести</button></div>`);
    let chosen = null;
    $("#mv-folders").querySelectorAll("button").forEach((b) => b.addEventListener("click", () => { chosen = b.dataset.t; $("#mv-folders").querySelectorAll("button").forEach((x) => x.classList.toggle("on", x === b)); $("#mv-new").value = ""; }));
    $("#mv-go").addEventListener("click", async () => {
      const topic = ($("#mv-new").value || "").trim() || chosen;
      if (topic === null) return toast("Выбери папку");
      const r = await api("moveWords", { ens, topic: topic || null });
      if (r && r.ok) { state.vocab = r; state.selected.clear(); closeSheet(); toast(`Перенесено: ${r.moved}`); if (state.folder !== "*") state.folder = topic ? (r.folders.find((f) => f.label.toLowerCase() === String(topic).toLowerCase()) || {}).key || state.folder : "__general__"; renderWordList(); } else toast("Не получилось перенести");
    });
  }
  function openAddSheet(topicLabel) {
    openSheet(`<h3>Добавить слова${topicLabel ? ` в «${esc(topicLabel)}»` : ""}</h3>
      <textarea id="add-text" rows="6" placeholder="reliable . надёжный&#10;keep up . не отставать${topicLabel ? "" : "&#10;&#10;Первой строкой можно указать папку: #школа"}"></textarea>
      <div style="margin-top:12px"><button class="btn primary" id="add-go">Добавить</button></div>
      <div class="muted" style="margin-top:10px">Слово, которое уже есть в словаре, переедет в указанную папку.</div>`);
    $("#add-go").addEventListener("click", async () => {
      const text = $("#add-text").value;
      if (!text.trim()) return;
      const r = await api("addWords", { text, topic: topicLabel || undefined });
      if (r && r.ok) { state.vocab = r; closeSheet(); toast(`Добавлено: ${r.added}${r.moved ? `, перенесено: ${r.moved}` : ""}${r.badLines && r.badLines.length ? `, не распознано строк: ${r.badLines.length}` : ""}`); if (state.folder !== null) renderWordList(); else renderVocab(); }
      else toast(r && r.error === "no_pairs" ? "Не нашла ни одной пары «слово . перевод»" : "Не получилось добавить");
    });
  }
  function openRenameSheet(from) {
    openSheet(`<h3>Переименовать папку «${esc(from)}»</h3><input class="txt" id="rn" value="${esc(from)}" /><div style="margin-top:12px"><button class="btn primary" id="rn-go">Сохранить</button></div>`);
    $("#rn-go").addEventListener("click", async () => {
      const to = ($("#rn").value || "").trim(); if (!to || to === from) return closeSheet();
      const r = await api("renameFolder", { from, to });
      if (r && r.ok) { state.vocab = r; closeSheet(); state.folder = (r.folders.find((f) => f.label === to) || {}).key || null; toast("Папка переименована"); if (state.folder) renderWordList(); else renderVocab(); } else toast("Не получилось");
    });
  }

  async function openTopic(id) {

    }
    state.offline = false;
    state.topic = r.topic; state.topicProgress = r.progress; state.topicNotes = r.notes || [];
    cacheTopic(id, { topic: r.topic, progress: r.progress, notes: r.notes || [] });

  // тренировка: предложение с пропуском и 3 варианта из слов этой же темы
  function renderInterestQuiz(root) {
    const f = state.feed; const st = state.study; if (!f || !f.items.length) return go("interests");
    const items = f.items; const i = st.i || 0;
    if (i >= items.length) { root.innerHTML = `<div class="head lavender"><div>${backLink("Мои темы")}<div class="ttl" style="margin-top:6px">⚡ Итог</div></div></div><div class="card aqua" style="text-align:center"><div class="big">${st.score}<span style="font-size:20px;color:var(--muted)"> / ${items.length}</span></div><div style="margin-top:6px">${st.score === items.length ? "Идеально! 🎉" : "Хорошо — завтра будут новые предложения"}</div></div><div class="navbtns"><button class="btn" id="q-again">Ещё раз</button><button class="btn primary" id="q-back">К предложениям</button></div>`; $("#q-again").addEventListener("click", () => go("iquiz", { i: 0, score: 0 })); $("#q-back").addEventListener("click", () => go("interests")); return; }
    const it = items[i]; const target = it.vocab[(i + (st.score || 0)) % it.vocab.length] || it.vocab[0];
    const re = new RegExp(target.en.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "i");
    const qEn = esc(it.en).replace(new RegExp(esc(target.en).replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "i"), `<code>${"_".repeat(Math.min(10, Math.max(4, target.en.length)))}</code>`);
    // варианты: это слово + 2 других слова того же уровня/темы из ленты
    // неверные варианты — слова той же темы (сначала из этой же темы, потом из остальных)
    const pick = (list) => [...new Set(list.filter((x) => x !== it).flatMap((x) => x.vocab.map((v) => v.en)).filter((v) => v.toLowerCase() !== target.en.toLowerCase() && Math.abs(v.split(" ").length - target.en.split(" ").length) <= 1))];
    let others = pick(items.filter((x) => x.topicKey === it.topicKey)); if (others.length < 2) others = others.concat(pick(items).filter((v) => !others.includes(v)));
    const opts = st.opts && st.optsFor === i ? st.opts : seededShuffle([target.en, ...seededShuffle(others, i * 13 + 7).slice(0, 2)], i * 31 + 3).map((t) => ({ text: t, ok: t === target.en }));

      <div class="bar" style="margin:4px 0 12px"><i style="width:${Math.round((i / items.length) * 100)}%"></i></div>
      <div class="card"><div class="muted" style="margin-bottom:6px">Вставь слово</div><div class="sent">${qEn}</div><div class="sent-ru">${esc(it.ru)}</div></div>
      ${opts.map((o, k) => `<button class="opt ${answered ? (o.ok ? "ok" : k === st.picked ? "bad" : "dim") : ""}" data-k="${k}" ${answered ? "disabled" : ""}>${esc(o.text)}</button>`).join("")}
      ${answered ? `<div class="card" style="margin-top:14px;background:${opts[st.picked].ok ? "var(--ok-bg)" : "var(--bad-bg)"}"><div style="font-size:15px;font-weight:500;color:${opts[st.picked].ok ? "var(--ok-fg)" : "var(--bad-fg)"}">${opts[st.picked].ok ? "Верно! ✓" : "Не совсем"}</div><div class="sent" style="font-size:16px;margin-top:6px">${esc(it.en).replace(new RegExp(esc(target.en).replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "i"), (m) => `<b>${m}</b>`)}</div><div class="muted" style="margin-top:4px">${esc(target.en)} — ${esc(target.ru)}</div></div><div style="margin-top:12px"><button class="btn primary" id="q-next">${i + 1 >= items.length ? "Итог" : "Далее"}</button></div>` : ""}`;
    root.querySelectorAll(".opt").forEach((b) => b.addEventListener("click", () => { st.picked = Number(b.dataset.k); if (opts[st.picked].ok) { st.score = (st.score || 0) + 1; haptic("medium"); } renderStudy(); }));

    root.innerHTML = `<div class="head pink"><div>${backLink("Учёба")}<div class="ttl" style="margin-top:6px">💬 Сленг</div><div class="sub">${state.slang.length} американских фраз · нажми на фразу, чтобы увидеть пример</div></div></div>
      <div class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="slq" value="${esc(state.study.q || "")}" placeholder="Искать фразу" /></div>
      <div class="card" style="margin-top:12px;padding:4px 16px">${items.map((s, i) => `<div class="slang" data-i="${i}"><div class="en">${esc(s.en)}</div><div class="ru">${esc(s.ru)}</div>${s.example ? `<div class="exm">— ${esc(s.example.setupEn)}<br><span class="muted">${esc(s.example.setupRu)}</span><br>— <b>${esc(s.example.en)}</b></div>` : ""}</div>`).join("") || `<div class="muted" style="padding:12px 0">Ничего не найдено.</div>`}</div>
      <div style="margin-top:14px"><button class="btn" data-start="slang">Потренировать фразы в чате</button></div><div style="height:16px"></div>`;
    $("#slq").addEventListener("input", (e) => { state.study.q = e.target.value; renderStudy(); setTimeout(() => { const i = $("#slq"); i.focus(); i.setSelectionRange(i.value.length, i.value.length); }, 0); });
    root.querySelectorAll(".slang").forEach((el) => el.addEventListener("click", () => { el.classList.toggle("open"); haptic(); }));
    bindStart(root);
  }

  if (DEMO) window.__dbg = { go, openTopic, demo, buildOptions, exItems, parseItems, cleanAns, mutate, topicAnswerPool, explainHtml, setTopic: (t) => { state.topic = t; } };
  // ---------- Навигация ----------
  async function showPage(name) {
    document.querySelectorAll(".page").forEach((p) => p.classList.toggle("active", p.id === "page-" + name));
    document.querySelectorAll(".tab").forEach((t) => t.classList.toggle("active", t.dataset.page === name));
    removeActions(); closeSheet(); window.scrollTo(0, 0);
    if (!state.me) return;
    if (name === "vocab") { renderVocab(); if (!state.vocab) { await loadVocab(); renderVocab(); } if (state.selected.size) renderActions(); }
    if (name === "study") { renderStudy(); if (!state.course) { await loadCourse(); renderStudy(); } }
    if (name === "blitz") renderBlitz();
    if (name === "account") { renderAccount(); await loadOptions(); renderAccount(); }
    if (name === "progress") { const m = await api("me"); if (m && m.ok) { state.me = m; renderProgress(m); } }
  }
  document.querySelectorAll(".tab").forEach((t) => t.addEventListener("click", () => { haptic(); showPage(t.dataset.page); }));
  const startPage = (new URLSearchParams(location.search).get("page")) || (tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param) || "study";
  // Кнопка «назад» Telegram ведёт по экранам курса
  if (tg && tg.BackButton) { try { tg.BackButton.onClick(() => studyBack()); } catch (e) {} }

  function fail(msg) { $("#page-progress").innerHTML = `<div class="notice">${msg}</div>`; }
  const firstPage = ["vocab", "blitz", "account", "progress", "study"].includes(startPage) ? startPage : "study";
  let startedFromCache = false;
  const cachedMe = DEMO ? null : cached("me");
  if (cachedMe && cachedMe.ok) {
    // Мгновенный старт: рисуем из кэша, свежие данные подтянутся в фоне
    startedFromCache = true;
    state.me = cachedMe; state.gender = cachedMe.user.gender; renderProgress(cachedMe);
    if (cached("course")) { state.course = cached("course"); }
    showPage(firstPage);
    setTimeout(() => $("#splash").classList.add("hide"), 50);
  }
  api("me").then(async (d) => {
    if (!d || !d.ok) {
      if (startedFromCache && (!d || d.error === "network" || String(d.error || "").startsWith("http_"))) { state.offline = true; toast("Нет связи — работаем из сохранённой копии"); return; }
      if (d && d.error === "no_access") fail("У тебя пока нет доступа к тренажёру. Напиши преподавателю — она откроет.");
      else if (d && d.error === "auth") { try { localStorage.removeItem("__appToken"); } catch (e) {} fail(`Не удалось подтвердить, что это ты. Напиши боту /app и открой приложение кнопкой из его ответа. (${tgDiag()})`); }
      else fail(`Что-то пошло не так: ${(d && d.error) || "нет ответа"}${d && d.detail ? " — " + String(d.detail).slice(0, 80) : ""}. (${tgDiag()})`);
      if (startedFromCache) { try { localStorage.removeItem(ck("me")); } catch (e) {} showPage("progress"); }
      return;
    }
    state.me = d; state.gender = d.user.gender; if (!DEMO) cacheSet("me", d);
    if (startedFromCache) {
      renderProgress(d);
      // Обновляем курс в фоне (прогресс мог измениться в чате)
      const c = await api("course"); if (c && c.ok) { state.course = c; state.courseError = null; cacheSet("course", c); if (document.querySelector("#page-study.active")) renderStudy(); }
      return;
    }
    renderProgress(d);
    showPage(firstPage);
  }).catch(() => { if (!startedFromCache) fail("Нет связи с ботом. Проверь интернет и попробуй снова."); }).finally(() => {
    setTimeout(() => $("#splash").classList.add("hide"), DEMO ? 400 : 150);
  });
})();
</script>
</body>
</html>
