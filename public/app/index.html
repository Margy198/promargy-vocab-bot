<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Promargy</title>
<meta name="description" content="Мини-приложение тренажёра Promargy: прогресс, словарь, лига, блиц." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  /* Дизайн-система из макетов Маргариты (Sketch «Приложение 1»):
     фон #fbfbfb, текст #2e2e2e / #3d3542, акцент #1dfff8→#11c8c4,
     мягкий акцент #91fcf9 (40%), пастельные градиенты карточек,
     скругления 16 / 10 / 30, шрифт Avenir Next → Manrope. */
  :root {
    --bg: #fbfbfb;
    --card: #ffffff;
    --text: #2e2e2e;
    --text-2: #3d3542;
    --muted: #8a8a92;
    --line: #ececf0;
    --accent: #17afa8;
    --accent-strong: #11c8c4;
    --accent-light: #1dfff8;
    --accent-soft: rgba(145, 252, 249, 0.4);
    --glow: rgba(55, 241, 236, 0.45);
    --g-aqua: linear-gradient(120deg, #b8fffd 0%, #dae1f7 100%);
    --g-lavender: linear-gradient(120deg, #dae1f7 0%, #ffb9dd 100%);
    --g-pink: linear-gradient(120deg, #ffb9dd 0%, #f7eeda 100%);
    --g-cream: linear-gradient(120deg, #f7eeda 0%, #e6ffff 100%);
    --g-accent: linear-gradient(135deg, #1dfff8 0%, #11c8c4 100%);
    --g-splash: linear-gradient(160deg, #ffffff 0%, #c8fffd 55%, #37f1ec 100%);
    --radius: 16px;
    --radius-s: 10px;
    --shadow: 0 10px 30px rgba(61, 53, 66, 0.08);
    --tabbar-h: 72px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font-family: "Manrope", "Avenir Next", system-ui, -apple-system, sans-serif; font-weight: 400; -webkit-font-smoothing: antialiased; }
  body { min-height: 100vh; padding-bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom)); }
  .page { max-width: 560px; margin: 0 auto; padding: 16px 16px 24px; display: none; }
  .page.active { display: block; }
  h1, h2, h3 { font-weight: 500; margin: 0; color: var(--text-2); }
  h1 { font-size: 26px; letter-spacing: -0.01em; }
  h2 { font-size: 18px; margin: 22px 0 12px; }
  .muted { color: var(--muted); font-size: 13px; }
  .row { display: flex; align-items: center; gap: 10px; }
  .between { justify-content: space-between; }
  .card { background: var(--card); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); }
  .card + .card { margin-top: 12px; }
  .card.aqua { background: var(--g-aqua); }
  .card.lavender { background: var(--g-lavender); }
  .card.pink { background: var(--g-pink); }
  .card.cream { background: var(--g-cream); }
  .pill { display: inline-block; padding: 5px 10px; border-radius: 8px; background: rgba(255, 255, 255, 0.75); font-size: 13px; color: var(--text-2); }
  .pill.ok { background: #a8d29f; color: #fff; }
  .pill.accent { background: var(--accent-soft); }
  .big { font-size: 40px; font-weight: 500; line-height: 1; color: var(--text-2); }
  .fab { width: 46px; height: 46px; border-radius: 50%; background: var(--g-accent); display: grid; place-items: center; box-shadow: 0 8px 22px var(--glow); border: none; color: #2e2e2e; flex: none; cursor: pointer; }
  .fab svg { width: 20px; height: 20px; }
  .bar { height: 8px; border-radius: 8px; background: rgba(61, 53, 66, 0.08); overflow: hidden; }
  .bar > i { display: block; height: 100%; border-radius: 8px; background: var(--g-accent); box-shadow: 0 0 12px var(--glow); transition: width .6s ease; }
  .quest { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .quest:last-child { border-bottom: none; }
  .check { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--accent-light); display: grid; place-items: center; flex: none; color: #fff; font-size: 14px; }
  .check.done { background: var(--g-accent); border-color: transparent; box-shadow: 0 0 10px var(--glow); color: #2e2e2e; }
  .quest .t { flex: 1; font-size: 14px; }
  .quest .p { font-size: 13px; color: var(--muted); }
  .chart { display: flex; align-items: flex-end; gap: 6px; height: 92px; padding-top: 8px; }
  .chart .col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .chart .b { width: 100%; max-width: 22px; border-radius: 6px 6px 3px 3px; background: var(--g-accent); min-height: 3px; opacity: .9; }
  .chart .b.empty { background: rgba(61, 53, 66, 0.08); }
  .chart .d { font-size: 10px; color: var(--muted); }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .ach { background: var(--card); border-radius: var(--radius-s); padding: 10px 6px; text-align: center; box-shadow: var(--shadow); }
  .ach .e { font-size: 26px; }
  .ach .n { font-size: 11px; color: var(--text-2); margin-top: 4px; line-height: 1.2; }
  .ach.locked { opacity: .38; filter: grayscale(1); }
  .word { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  .word:last-child { border-bottom: none; }
  .word .ru { color: var(--muted); }
  .word .n { color: #8f3d64; font-size: 12px; margin-left: 8px; }
  .tabbar { position: fixed; left: 0; right: 0; bottom: 0; height: calc(var(--tabbar-h) + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom); background: rgba(255, 255, 255, 0.92); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-radius: 20px 20px 0 0; box-shadow: 0 -8px 30px rgba(61, 53, 66, 0.08); display: flex; justify-content: space-around; align-items: center; }
  .tab { background: none; border: none; display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--text-2); font: inherit; font-size: 11px; padding: 6px 8px; cursor: pointer; }
  .tab svg { width: 24px; height: 24px; stroke: var(--accent-light); fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; filter: drop-shadow(0 0 6px var(--glow)); }
  .tab.active svg { stroke: var(--accent); }
  .tab.active { color: var(--accent); }
  .splash { position: fixed; inset: 0; background: var(--g-splash); display: grid; place-items: center; z-index: 10; transition: opacity .4s ease; }
  .splash .logo { font-size: 44px; font-weight: 400; color: #3d3542; letter-spacing: 0.01em; }
  .splash .dot { position: absolute; top: 36px; left: 28px; width: 20px; height: 20px; border-radius: 50%; background: var(--g-accent); box-shadow: 0 6px 16px var(--glow); }
  .splash.hide { opacity: 0; pointer-events: none; }
  .notice { background: var(--card); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow); font-size: 14px; line-height: 1.5; }
  .quote { font-style: italic; font-size: 14px; color: var(--text-2); text-align: center; line-height: 1.45; }
  .quote .by { display: block; text-align: right; font-size: 11px; color: var(--muted); font-style: italic; margin-top: 6px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 14px; border-radius: var(--radius); border: none; font: inherit; font-size: 15px; color: var(--text-2); background: var(--accent-soft); cursor: pointer; }
  .btn.primary { background: var(--g-accent); box-shadow: 0 10px 24px var(--glow); }
  .soon { text-align: center; padding: 48px 16px; color: var(--muted); }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #fbfbfb; }
  }
</style>
</head>
<body>
<div class="splash" id="splash"><div class="dot"></div><div class="logo">Promargy</div></div>

<main class="page active" id="page-progress"></main>
<main class="page" id="page-vocab"><div class="soon">Словарь — следующий этап</div></main>
<main class="page" id="page-league"><div class="soon">Лига — следующий этап</div></main>
<main class="page" id="page-blitz"><div class="soon">Блиц — следующий этап</div></main>
<main class="page" id="page-account"><div class="soon">Аккаунт — следующий этап</div></main>

<nav class="tabbar" id="tabbar">
  <button class="tab active" data-page="progress"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Прогресс</button>
  <button class="tab" data-page="vocab"><svg viewBox="0 0 24 24"><path d="M3 6a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>Словарь</button>
  <button class="tab" data-page="league"><svg viewBox="0 0 24 24"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0zM7 6H4v2a3 3 0 0 0 3 3M17 6h3v2a3 3 0 0 1-3 3"/></svg>Лига</button>
  <button class="tab" data-page="blitz"><svg viewBox="0 0 24 24"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg>Блиц</button>
  <button class="tab" data-page="account"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>Аккаунт</button>
</nav>

<script>
(function () {
  const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
  const initData = tg && tg.initData ? tg.initData : "";
  const API = "/telegram-webhook";
  const DEMO = !initData; // вне Telegram — показываем демо-данные

  if (tg) {
    try { tg.ready(); tg.expand(); tg.setHeaderColor("#fbfbfb"); tg.setBackgroundColor("#fbfbfb"); } catch (e) {}
  }

  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const plural = (n, f) => { const a = Math.abs(n) % 100, b = a % 10; if (a > 10 && a < 20) return f[2]; if (b > 1 && b < 5) return f[1]; if (b === 1) return f[0]; return f[2]; };
  const gend = (data, m, f) => data.user && data.user.gender === "f" ? f : data.user && data.user.gender === "m" ? m : m + "(" + f.slice(m.length) + ")";

  async function api(action, extra) {
    if (DEMO) return demo(action);
    const r = await fetch(API, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(Object.assign({ initData, action }, extra || {})) });
    return r.json();
  }

  function demo(action) {
    const today = new Date();
    const days = [];
    for (let i = 13; i >= 0; i--) { const d = new Date(today.getTime() - i * 864e5); days.push({ date: d.toISOString().slice(0, 10), answers: [12, 20, 0, 15, 24, 18, 9, 30, 22, 0, 16, 25, 19, 7][13 - i], xp: 0 }); }
    return Promise.resolve({
      ok: true,
      user: { firstName: "Аня", avatar: "🦄", gender: "f" },
      streak: 12, bestStreak: 23, practicedToday: false, freezes: 2, freezesMax: 2,
      xp: 1240, level: { number: 3, name: "Confident", next: "Advanced", toNext: 260, progress: 0.65 },
      xpToday: 70, xpWeek: 410, goal: 20, todayCount: 7, answered: 1480, correct: 1210,
      vocabCount: 378, dueCount: 23, victories: 6, blitzBest: { correct: 8, seconds: 47 },
      quests: [{ id: "a", title: "Ответить на 15 вопросов", target: 15, progress: 7, done: false }, { id: "b", title: "5 верных подряд", target: 5, progress: 5, done: true }, { id: "c", title: "Победить 1 слово из списка ошибок", target: 1, progress: 0, done: false }],
      achievements: [["💯", "Первые 100 слов", "2026-10-02"], ["🚀", "Пятьсот", "2026-10-21"], ["🏔", "Тысяча", null], ["🎯", "Снайпер", "2026-10-11"], ["🔥", "Неделя без пропусков", "2026-10-09"], ["🌟", "Месяц без пропусков", null], ["💎", "Сто дней", null], ["👑", "Год без пропусков", null], ["🏆", "Победитель", "2026-10-30"], ["📁", "Папка пройдена", "2026-10-15"], ["⚡", "Блиц-мастер", null], ["🗓", "Идеальная неделя", null], ["🛡", "Десять побед", null]].map(([emoji, title, date]) => ({ emoji, title, date })),
      wrongTop: [{ en: "reluctant", ru: "неохотный", errors: 4 }, { en: "stave off", ru: "предотвращать", errors: 3 }, { en: "endure", ru: "терпеть; выдерживать", errors: 2 }],
      days,
      reminders: { enabled: true, everyDays: 1, hours: [10, 20] },
      league: { optIn: true, anon: false },
    });
  }

  function iconArrow() { return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>'; }

  function renderProgress(d) {
    const name = d.user.firstName ? `, ${esc(d.user.firstName)}` : "";
    const avatar = d.user.avatar ? `${esc(d.user.avatar)} ` : "";
    const streakWord = plural(d.streak, ["день", "дня", "дней"]);
    const freezes = "🧊".repeat(d.freezes) + "<span style=\"opacity:.25\">" + "🧊".repeat(Math.max(0, d.freezesMax - d.freezes)) + "</span>";
    const goalPct = d.goal ? Math.min(100, Math.round((d.todayCount / d.goal) * 100)) : 0;
    const goalDone = d.goal && d.todayCount >= d.goal;
    const max = Math.max(1, ...d.days.map((x) => x.answers));
    const chart = d.days.map((x) => `<div class="col"><div class="b ${x.answers ? "" : "empty"}" style="height:${Math.max(4, Math.round((x.answers / max) * 70))}px" title="${x.date}: ${x.answers}"></div><div class="d">${x.date.slice(8).replace(/^0/, "")}</div></div>`).join("");
    const quests = d.quests.map((q) => `<div class="quest"><div class="check ${q.done ? "done" : ""}">${q.done ? "✓" : ""}</div><div class="t">${esc(q.title)}</div><div class="p">${q.progress}/${q.target}</div></div>`).join("");
    const done = d.quests.filter((q) => q.done).length;
    const ach = d.achievements.map((a) => `<div class="ach ${a.date ? "" : "locked"}" title="${esc(a.desc || a.title)}"><div class="e">${a.emoji}</div><div class="n">${esc(a.title)}</div></div>`).join("");
    const wrong = d.wrongTop.length ? d.wrongTop.map((w) => `<div class="word"><span>${esc(w.en)}<span class="n">×${w.errors}</span></span><span class="ru">${esc(w.ru || "")}</span></div>`).join("") : `<div class="muted">Список ошибок пуст — так держать.</div>`;
    const accuracy = d.answered ? Math.round((d.correct / d.answered) * 100) : 0;

    $("#page-progress").innerHTML = `
      <div class="row between" style="margin-bottom:14px">
        <div><h1>${avatar}Привет${name}</h1><div class="muted">уровень ${d.level.number} · ${esc(d.level.name)}</div></div>
        <button class="fab" id="go-practice" title="Заниматься">${iconArrow()}</button>
      </div>

      <div class="card aqua">
        <div class="row between">
          <div>
            <div class="big">🔥 ${d.streak}</div>
            <div style="margin-top:6px">${streakWord} подряд${d.bestStreak > d.streak ? ` · рекорд ${d.bestStreak}` : ""}</div>
          </div>
          <div style="text-align:right">
            <div style="font-size:22px;letter-spacing:2px">${freezes}</div>
            <div class="muted" style="margin-top:4px">заморозки</div>
          </div>
        </div>
        <div style="margin-top:12px"><span class="pill ${d.practicedToday ? "ok" : ""}">${d.practicedToday ? "Сегодня ✓" : `Сегодня ещё не ${gend(d, "занимался", "занималась")}`}</span></div>
      </div>

      <div class="card">
        <div class="row between"><div><strong style="font-weight:500">⭐ ${d.xp} XP</strong> <span class="muted">· ${esc(d.level.name)}</span></div><div class="muted">${d.level.next ? `ещё ${d.level.toNext} до ${esc(d.level.next)}` : "максимум"}</div></div>
        <div class="bar" style="margin-top:10px"><i style="width:${Math.round(d.level.progress * 100)}%"></i></div>
        <div class="muted" style="margin-top:8px">сегодня +${d.xpToday} · за неделю ${d.xpWeek}</div>
      </div>

      <div class="card ${goalDone ? "cream" : "lavender"}">
        <div class="row between">
          <div><div style="font-size:15px">🎯 Цель на день</div><div class="muted" style="margin-top:2px">${d.goal ? (goalDone ? "выполнена" : `${d.todayCount} из ${d.goal} слов`) : "не задана — задай в «Аккаунт»"}</div></div>
          <div class="big" style="font-size:28px">${d.goal ? `${goalPct}%` : "—"}</div>
        </div>
        ${d.goal ? `<div class="bar" style="margin-top:12px;background:rgba(255,255,255,.6)"><i style="width:${goalPct}%"></i></div>` : ""}
      </div>

      <h2>Квесты дня <span class="muted" style="font-weight:400">${done}/${d.quests.length}</span></h2>
      <div class="card" style="padding:4px 16px">${quests}</div>

      <h2>Две недели</h2>
      <div class="card"><div class="chart">${chart}</div><div class="muted" style="margin-top:8px">ответов в день · всего ${d.answered}, точность ${accuracy}%</div></div>

      <h2>Повторение</h2>
      <div class="card pink">
        <div class="row between">
          <div><div style="font-size:15px">📅 Пора повторить</div><div class="muted" style="margin-top:2px">${d.dueCount ? `${d.dueCount} ${plural(d.dueCount, ["слово", "слова", "слов"])} из ${d.vocabCount}` : "на сегодня всё повторено"}</div></div>
          <button class="fab" data-go="practice">${iconArrow()}</button>
        </div>
      </div>
      <div class="card" style="margin-top:12px"><div class="muted" style="margin-bottom:6px">Чаще всего путаешь</div>${wrong}</div>

      <h2>Ачивки <span class="muted" style="font-weight:400">${d.achievements.filter((a) => a.date).length}/${d.achievements.length}</span></h2>
      <div class="grid">${ach}</div>
      <div class="muted" style="margin-top:12px">🛡 Побеждённых слов: ${d.victories}${d.blitzBest ? ` · ⚡ рекорд блица ${d.blitzBest.correct}/10 за ${d.blitzBest.seconds} с` : ""}</div>
    `;
    document.querySelectorAll("#go-practice, [data-go=practice]").forEach((b) => b.addEventListener("click", () => {
      if (tg) { try { tg.close(); } catch (e) {} } else alert("В Telegram эта кнопка закрывает приложение и возвращает в чат к кнопке «Лексика».");
    }));
  }

  function showPage(name) {
    document.querySelectorAll(".page").forEach((p) => p.classList.toggle("active", p.id === "page-" + name));
    document.querySelectorAll(".tab").forEach((t) => t.classList.toggle("active", t.dataset.page === name));
    window.scrollTo(0, 0);
  }
  document.querySelectorAll(".tab").forEach((t) => t.addEventListener("click", () => showPage(t.dataset.page)));

  function fail(msg) {
    $("#page-progress").innerHTML = `<div class="notice">${msg}</div>`;
  }

  api("me").then((d) => {
    if (!d || !d.ok) {
      if (d && d.error === "no_access") fail("У тебя пока нет доступа к тренажёру. Напиши преподавателю — она откроет.");
      else if (d && d.error === "auth") fail("Не удалось подтвердить, что это ты. Закрой приложение и открой его снова из бота.");
      else fail("Что-то пошло не так. Попробуй открыть приложение ещё раз.");
    } else {
      renderProgress(d);
    }
  }).catch(() => fail("Нет связи с ботом. Проверь интернет и попробуй снова.")).finally(() => {
    setTimeout(() => $("#splash").classList.add("hide"), DEMO ? 400 : 150);
  });
})();
</script>
</body>
</html>
